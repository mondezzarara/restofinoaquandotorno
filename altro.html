<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canzoni</title>

  <style>
    :root {
      --paper: #f5f2e6; /* Soft Ivory */
      --ink: #050505;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* FADE-IN */
    #content {
      opacity: 0;
      transition: opacity .8s ease;
    }
    #content.visible {
      opacity: 1;
    }

    .page {
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .frame {
      position: relative;
      width: min(64vw, 620px);
      height: 100%;
      padding: 3vh 10% 0;
    }

    /* TASTI A DESTRA — IDENTICI A editoriali.html */
    .nav-icons {
      position: fixed;
      right: 1%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0;
      z-index: 999;
    }

    .icon-square,
    .icon-circle,
    .icon-triangle {
      width: 22px;
      height: 22px;
      transition: opacity .25s ease;
    }

    .icon-square {
      background: rgba(80,120,255,0.30);
      border-radius: 3px;
    }

    .icon-circle {
      background: rgba(255,80,80,0.30);
      border-radius: 50%;
    }

    .icon-triangle {
      background: rgba(180,80,255,0.30);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .icon-square:active,
    .icon-circle:active,
    .icon-triangle:active {
      opacity: .55;
    }

    /* TRE CERCHI ROSSI PALLIDI — identici al tasto rosso */
    .music-layout {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4vh;
      margin-top: 6vh;
    }

    .track-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,80,80,0.30);
      cursor: pointer;
      transition: opacity .25s ease;
    }

    .track-circle:active {
      opacity: .55;
    }

    /* LINEA PLAYER IN BASSO */
    #player-line {
      position: fixed;
      bottom: 3vh;
      left: 10%;
      width: 80%;
      height: 3px;
      background: rgba(255,80,80,0.30);
      border-radius: 999px;
      transform-origin: left;
      transform: scaleX(0);
      transition: transform linear;
      z-index: 900;
    }
  </style>
</head>

<body>

  <div id="content">
    <main class="page">
      <section class="frame">

        <!-- TASTI -->
        <div class="nav-icons">
          <a href="index.html" class="icon-square"></a>
          <a href="altro.html" class="icon-circle"></a>
          <a href="editoriali.html" class="icon-triangle"></a>
        </div>

        <!-- TRE CERCHI -->
        <div class="music-layout">
          <div class="track-circle" onclick="playSong('canzone1')"></div>
          <div class="track-circle" onclick="playSong('canzone2')"></div>
          <div class="track-circle" onclick="playSong('canzone3')"></div>
        </div>

      </section>
    </main>
  </div>

  <!-- AUDIO -->
  <audio id="canzone1" src="canzone1.mp3"></audio>
  <audio id="canzone2" src="canzone2.mp3"></audio>
  <audio id="canzone3" src="canzone3.mp3"></audio>

  <!-- PLAYER -->
  <div id="player-line"></div>

  <script>
    window.addEventListener("load", () => {
      document.getElementById("content").classList.add("visible");
    });

    function playSong(id) {
      const audio = document.getElementById(id);
      const line = document.getElementById("player-line");

      /* Stop all songs */
      ["canzone1","canzone2","canzone3"].forEach(name => {
        const a = document.getElementById(name);
        a.pause();
        a.currentTime = 0;
      });

      /* Reset line */
      line.style.transitionDuration = "0s";
      line.style.transform = "scaleX(0)";

      /* Play selected */
      audio.play();

      /* Animate line */
      const duration = audio.duration || 5; /* fallback */
      line.style.transitionDuration = duration + "s";
      line.style.transform = "scaleX(1)";
    }
  </script>

</body>
</html>
