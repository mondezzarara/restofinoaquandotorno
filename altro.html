<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idee Valide — Altro</title>

  <style>
    :root {
      --paper: #f3f3df;
      --ink: #050505;
      --frame-width: min(64vw, 620px);
      --frame-height: 100svh;
      --red: rgba(255, 80, 80, 0.30);
      --blue: rgba(80, 120, 255, 0.30);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      font-family: Helvetica, Arial, sans-serif;
    }

    .page {
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 0;
    }

    .frame {
      position: relative;
      width: var(--frame-width);
      height: 100%;
      overflow: hidden;
      padding: 3vh 10% 0;
      background: transparent;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 7px solid var(--ink);
      border-bottom: none;
      clip-path: polygon(
        3% 1%, 98% 3%, 96% 38%,
        97% 90%, 50% 95%, 4% 90%,
        3% 68%, 5% 48%
      );
      filter: url("#rough");
      pointer-events: none;
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 4px -2px -2px 3px;
      border: 4px solid var(--ink);
      border-bottom: none;
      clip-path: polygon(
        4% 2%, 97% 4%, 94% 39%,
        96% 90%, 50% 95%, 6% 90%,
        4% 69%, 6% 48%
      );
      opacity: .8;
      pointer-events: none;
    }

    .top-fade {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 14vh;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        var(--paper) 0%,
        rgba(243,243,223,0.95) 10%,
        rgba(243,243,223,0.80) 30%,
        rgba(243,243,223,0.55) 55%,
        rgba(243,243,223,0.30) 75%,
        rgba(243,243,223,0.10) 90%,
        rgba(243,243,223,0) 100%
      );
    }

    /* Interruttore */
    .nav-icons {
      position: absolute;
      right: 1%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0;
      z-index: 30;
    }

    .icon-square,
    .icon-circle {
      width: 22px;
      height: 22px;
      transition: opacity .25s ease;
    }

    .icon-square {
      background: var(--blue);
      border-radius: 3px;
    }

    .icon-circle {
      background: var(--red);
      border-radius: 50%;
    }

    .icon-square:active,
    .icon-circle:active {
      opacity: 0.55;
    }

    /* Cerchi canzoni */
    .songs {
      margin-top: 10vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6vh;
    }

    .song-circle {
      width: 85px;
      height: 85px;
      background: var(--red);
      border-radius: 50%;
      transition: opacity .25s ease;
    }

    .song-circle:active {
      opacity: 0.55;
    }

    /* Player minimal */
    .player-line {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      width: 0%;
      background: var(--red);
      transition: width 0.1s linear;
    }

    @media (max-width: 700px) {
      :root { --frame-width: 90vw; }
      .frame { padding: 2.5vh 11% 0; }
      .icon-square, .icon-circle {
        width: 20px;
        height: 20px;
      }
      .song-circle {
        width: 70px;
        height: 70px;
      }
      .nav-icons {
        right: 2%;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="frame">

      <div class="top-fade"></div>

      <div class="nav-icons">
        <a href="index.html" class="icon-square"></a>
        <a href="altro.html" class="icon-circle"></a>
      </div>

      <div class="songs" id="songs"></div>

      <div class="player-line" id="playerLine"></div>

      <audio id="audio"></audio>

    </section>
  </main>

  <script>
    async function loadSongs() {
      const songsContainer = document.getElementById("songs");
      const audio = document.getElementById("audio");
      const playerLine = document.getElementById("playerLine");

      const response = await fetch("canzoni.json");
      const data = await response.json();

      data.tracks.forEach((track, index) => {
        const circle = document.createElement("div");
        circle.className = "song-circle";

        circle.addEventListener("click", () => {
          audio.src = track.file;
          audio.play();
        });

        songsContainer.appendChild(circle);
      });

      audio.addEventListener("timeupdate", () => {
        const progress = (audio.currentTime / audio.duration) * 100;
        playerLine.style.width = progress + "%";
      });

      playerLine.addEventListener("click", (e) => {
        const rect = playerLine.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const percent = x / rect.width;
        audio.currentTime = percent * audio.duration;
      });
    }

    loadSongs();
  </script>

</body>
</html>
