<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idee Valide</title>

  <style>
    :root {
      --paper: #f5f2e6;
      --ink: #050505;
      --red: rgba(255,80,80,0.30);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* LOGO INTRO */
    #intro-logo {
      position: fixed;
      inset: 0;
      background: var(--paper);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 1s ease;
      z-index: 2000;
    }

    #intro-logo img {
      width: 160px;
      opacity: 0;
      animation: fadeIn 1s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* TASTI A DESTRA */
    .nav-icons {
      position: fixed;
      right: 1%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0;
      z-index: 999;
    }

    .icon-square,
    .icon-circle,
    .icon-triangle {
      width: 22px;
      height: 22px;
      transition: opacity .25s ease;
    }

    .icon-square {
      background: rgba(80,120,255,0.30);
      border-radius: 3px;
    }

    .icon-circle {
      background: var(--red);
      border-radius: 50%;
    }

    .icon-triangle {
      background: rgba(180,80,255,0.30);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .icon-square:active,
    .icon-circle:active,
    .icon-triangle:active {
      opacity: .55;
    }

    /* CERCHIO ROSSO CENTRALE */
    .music-circle {
      width: 120px;
      height: 120px;
      background: var(--red);
      border-radius: 50%;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 150ms ease, opacity .25s ease;
      z-index: 900;
    }

    .music-circle:active {
      transform: translate(-50%, -50%) scale(0.92);
      opacity: .55;
    }

    /* ANIMAZIONE DEL CERCHIO (come il quadrato) */
    .pulse {
      animation: pulseAnim 0.24s ease;
    }

    @keyframes pulseAnim {
      0% { transform: translate(-50%, -50%) scale(0.92); }
      50% { transform: translate(-50%, -50%) scale(1.04); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

  </style>
</head>

<body>

  <!-- LOGO INTRO -->
  <div id="intro-logo">
    <img src="logo-intro.png" alt="">
  </div>

  <!-- TASTI -->
  <div class="nav-icons">
    <a href="index.html" class="icon-square"></a>
    <a href="altro.html" class="icon-circle"></a>
    <a href="editoriali.html" class="icon-triangle"></a>
  </div>

  <!-- CERCHIO ROSSO CENTRALE -->
  <div class="music-circle" onclick="playRandomSong(); animateCircle()"></div>

  <!-- AUDIO PLAYER INVISIBILE -->
  <audio id="player"></audio>

  <script>

    /* ⭐ ANIMAZIONE MINIMAL DEL CERCHIO */
    function animateCircle() {
      const circle = document.querySelector(".music-circle");
      circle.classList.remove("pulse");
      void circle.offsetWidth; // reset anim
      circle.classList.add("pulse");
    }

    /* ⭐ CANZONI RANDOMICHE */
    const songs = [
      "canzone1.mp3",
      "canzone2.mp3",
      "canzone3.mp3",
    ];

    function playRandomSong() {
      const player = document.getElementById("player");
      const randomIndex = Math.floor(Math.random() * songs.length);
      player.src = songs[randomIndex];
      player.play();
    }

    /* ⭐ LOGO → PAUSA → FADE OUT → PAGINA */
    window.addEventListener("load", () => {

      setTimeout(() => {
        document.getElementById("intro-logo").style.opacity = 0;

        setTimeout(() => {
          document.getElementById("intro-logo").style.display = "none";
        }, 1000);

      }, 1800);
    });

  </script>

</body>
</html>
