<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editoriali</title>

  <style>
    :root {
      --paper: #f3f3df;
      --ink: #050505;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 4vh;
    }

    /* FOTO COVER EDITORIALE */
    .editorial-cover {
      width: min(90vw, 600px);
      height: 28vh;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity .25s ease;
    }

    .editorial-cover:active {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- COVER EDITORIALE 1 (solo foto, nessuna scritta) -->
    <a href="editoriale1.html" style="text-decoration:none; color:inherit;">
      <div class="editorial-cover"
           style="background-image:url('editoriale1-cover.jpg');">
      </div>
    </a>

  </main>

</body>
</html>
