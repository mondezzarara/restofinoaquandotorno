<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ideevalide</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

  <!-- INTRO ANIMATO -->
  <div id="intro">
    <img src="logo-intro.png" id="intro-logo" alt="Logo">
  </div>

  <!-- CONTENUTO DEL RACCONTO -->
  <div id="content">
    <!-- QUI C'È IL TUO SITO, NON TOCCO NULLA -->
    <!-- Tutto il tuo racconto rimane identico -->
  </div>

  <!-- SCRIPT INTRO -->
  <script>
    window.addEventListener("load", () => {
      // Fade-out dopo 1.8 secondi
      setTimeout(() => {
        document.getElementById("intro").classList.add("fade-out");
      }, 1800);

      // Rimozione intro dopo la dissolvenza
      setTimeout(() => {
        document.getElementById("intro").style.display = "none";
      }, 2800);
    });
  </script>

</body>

</html>
