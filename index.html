<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flusso</title>

  <style>
    :root {
      --paper: #f3f3df;
      --ink: #050505;
      --frame-width: min(64vw, 620px);
      --frame-height: 82vh;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 0.5vh; /* quasi zero */
    }

    .frame {
      position: relative;
      width: var(--frame-width);
      height: var(--frame-height);
      overflow: hidden;

      padding: 3vh 10% 2vh; /* molto meno spazio sopra */
      background: transparent;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .frame::before {
      border: 7px solid var(--ink);
      clip-path: polygon(
        3% 1%, 98% 3%, 96% 38%, 97% 100%,
        4% 100%, 3% 68%, 5% 48%
      );
      filter: url("#rough");
    }

    .frame::after {
      inset: 4px -2px -2px 3px;
      border: 4px solid var(--ink);
      clip-path: polygon(
        4% 2%, 97% 4%, 94% 39%, 96% 100%,
        6% 100%, 4% 69%, 6% 48%
      );
      opacity: .8;
    }

    .story-window {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      overscroll-behavior: contain;
    }

    .story-window::-webkit-scrollbar {
      display: none;
    }

    .story {
      width: 100%;
      padding-bottom: 40vh;
    }

    .paragraph {
      margin: 0 0 1.2em;
      padding: 0;

      text-align: justify;
      text-align-last: left;

      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 5vw, 32px);
      line-height: .95;
      letter-spacing: -0.045em;
      word-spacing: -0.02em;
    }

    /* DISSOLVENZA MAGICA MIGLIORATA */
    .top-fade {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 14vh; /* più bassa */
      pointer-events: none;

      background: linear-gradient(
        to bottom,
        var(--paper) 0%,
        rgba(243,243,223,0.95) 10%,
        rgba(243,243,223,0.80) 30%,
        rgba(243,243,223,0.55) 55%,
        rgba(243,243,223,0.30) 75%,
        rgba(243,243,223,0.10) 90%,
        rgba(243,243,223,0) 100%
      );
    }

    .bottom-fade {
      position: absolute;
      z-index: 10;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 4vh;
      pointer-events: none;

      background: linear-gradient(
        to bottom,
        rgba(243,243,223,0),
        rgba(243,243,223,0.4),
        var(--paper)
      );
    }

    @media (max-width: 700px) {
      :root {
        --frame-width: 90vw;
        --frame-height: 80vh;
      }

      .frame {
        padding: 2.5vh 11% 2vh; /* ancora meno su mobile */
      }

      .paragraph {
        font-size: clamp(19px, 5.8vw, 28px);
        line-height: .96;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="frame">

      <div class="story-window" id="storyWindow">
        <div class="story" id="story"></div>
      </div>

      <div class="top-fade"></div>
      <div class="bottom-fade"></div>

    </section>
  </main>

  <script>
    const thoughts = [
      "resto fino a quando torno",
      "sembri una prof di inglese",
      "quando sono a milano ma non devo lavorare mi sento un po’ in colpa, come quando da piccolo restavo a casa da scuola… hai presente?",
      "ho incontrato il mio match?",
      "noi sul balcone al freddo, io fumo, lui no. nella casa vicina, una tapparella si abbassa all’improvviso, una luce rossa dietro. “guarda!”, mi dice, prendendomi il braccio. “non vorrei sbagliarmi, ma secondo me è una prostituta.”. io mi giro, ma non c’è più nessuno dietro la finestra. due secondi dopo rientriamo e mi bacia.",
      "voi del nord avete la nebbia nel cervello"
    ];

    const story = document.getElementById("story");
    const windowEl = document.getElementById("storyWindow");

    thoughts.forEach((thought) => {
      const p = document.createElement("p");
      p.className = "paragraph";
      p.textContent = thought;
      story.appendChild(p);
    });

    windowEl.scrollTop = 0;
  </script>

</body>
</html>
