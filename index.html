<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idee Valide — Racconto</title>

  <style>
    :root {
      --paper: #f5f2e6;
      --ink: #050505;
      --green: #3a5f3a; /* verde elegante per i racconti */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* LOGO INTRO */
    #intro-logo {
      position: fixed;
      inset: 0;
      background: var(--paper);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 1s ease;
      z-index: 2000;
    }

    #intro-logo img {
      width: 160px;
      opacity: 0;
      animation: fadeIn 1s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* TASTI A DESTRA */
    .nav-icons {
      position: fixed;
      right: 1%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0;
      z-index: 999;
    }

    .icon-square,
    .icon-circle,
    .icon-triangle {
      width: 22px;
      height: 22px;
      transition: opacity .25s ease;
    }

    .icon-square {
      background: rgba(80,120,255,0.30);
      border-radius: 3px;
    }

    .icon-circle {
      background: rgba(255,80,80,0.30);
      border-radius: 50%;
    }

    .icon-triangle {
      background: rgba(180,80,255,0.30);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    /* FRAME CENTRALE */
    .page {
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .frame {
      position: relative;
      width: min(64vw, 620px);
      height: 100%;
      padding: 3vh 10% 0;
      overflow: hidden;
    }

    /* TESTO RANDOMICO */
    .story-window {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .story-window::-webkit-scrollbar { display:none; }

    .story {
      padding-top: 2vh;
      opacity: 0;
      transition: opacity .8s ease;
    }

    .paragraph {
      margin: 0 0 1.2em;
      font-weight: 700;
      font-size: clamp(20px,5vw,32px);
      line-height: .95;
      letter-spacing: -0.045em;
      color: var(--green); /* verde elegante */
    }

    /* QUADRATO BLU GRANDE PER REFRESH */
    .refresh-square {
      position: fixed;
      bottom: 3%;
      right: 3%;
      width: 42px;
      height: 42px;
      background: rgba(80,120,255,0.30);
      border-radius: 4px;
      cursor: pointer;
      transition: transform 150ms ease, opacity .25s ease;
      z-index: 999;
    }

    .refresh-square:active {
      transform: scale(0.92);
      opacity: .55;
    }

    .pulse {
      animation: pulseAnim 0.24s ease;
    }

    @keyframes pulseAnim {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

  </style>
</head>

<body>

  <!-- LOGO INTRO -->
  <div id="intro-logo">
    <img src="logo-intro.png" alt="">
  </div>

  <!-- TASTI -->
  <div class="nav-icons">
    <a href="index.html" class="icon-square"></a>
    <a href="musica.html" class="icon-circle"></a>
    <a href="editoriali.html" class="icon-triangle"></a>
  </div>

  <!-- QUADRATO GRANDE PER REFRESH -->
  <div class="refresh-square" onclick="animateRefreshSquare(); loadRandomStory()"></div>

  <main class="page">
    <section class="frame">
      <div class="story-window">
        <div class="story" id="story"></div>
      </div>
    </section>
  </main>

      console.log("📊 STATISTICHE SVILUPPATORI");

      console.log("Editoriali letti:", localStorage.getItem("editorial_reads") || 0);
    }

      sq.classList.remove("pulse");

    }
