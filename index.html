<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flusso</title>

  <style>
    :root {
      --paper: #f3f3df;
      --ink: #050505;
      --frame-width: min(64vw, 620px);
      --frame-height: 82vh;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Titolo provvisorio dello schema */
    .instruction {
      position: fixed;
      top: 4vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 900px);
      text-align: center;
      font-size: clamp(15px, 1.8vw, 25px);
      line-height: .95;
      font-weight: 900;
      z-index: 20;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 8vh;
    }

    /*
      Contenitore principale.
      La cornice è volutamente irregolare, per ricordare il disegno
      originale. Il testo resta però perfettamente regolare al suo interno.
    */
    .frame {
      position: relative;
      width: var(--frame-width);
      height: var(--frame-height);
      overflow: hidden;

      /* Spazio superiore volutamente abbondante per la dissolvenza */
      padding: 18vh 8% 8vh;

      background: transparent;
    }

    /* Cornice disegnata con più bordi leggermente sfalsati */
    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .frame::before {
      border: 7px solid var(--ink);
      clip-path: polygon(
        3% 1%, 98% 3%, 96% 38%, 97% 100%,
        4% 100%, 3% 68%, 5% 48%
      );
      filter: url("#rough");
    }

    .frame::after {
      inset: 4px -2px -2px 3px;
      border: 4px solid var(--ink);
      clip-path: polygon(
        4% 2%, 97% 4%, 94% 39%, 96% 100%,
        6% 100%, 4% 69%, 6% 48%
      );
      opacity: .8;
    }

    /*
      La zona che contiene davvero il racconto.
      È scrollabile, ma la scrollbar è nascosta.
    */
    .story-window {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;

      /*
        Rende lo scorrimento naturale e mantiene il testo lontano
        dai bordi della cornice.
      */
      overscroll-behavior: contain;
    }

    .story-window::-webkit-scrollbar {
      display: none;
    }

    .story {
      width: 100%;
      padding-bottom: 65vh;
    }

    .paragraph {
      margin: 0 0 1.15em;
      padding: 0;

      /*
        Ogni pensiero occupa la stessa larghezza e viene giustificato.
        In questo modo la "forma" dei paragrafi resta compatta e regolare.
      */
      text-align: justify;
      text-align-last: left;
      hyphens: none;

      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 2.65vw, 34px);
      line-height: .91;
      letter-spacing: -0.055em;
      word-spacing: -0.025em;
    }

    /*
      Dissolvenza superiore.
      È separata dal testo e resta sempre sopra di esso.
      Il testo entra nella zona trasparente e scompare gradualmente.
    */
    .top-fade {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 22vh;
      pointer-events: none;

      background: linear-gradient(
        to bottom,
        var(--paper) 0%,
        var(--paper) 22%,
        rgba(243,243,223,.94) 43%,
        rgba(243,243,223,.55) 68%,
        rgba(243,243,223,0) 100%
      );
    }

    /*
      Piccolo fade anche sotto: non è necessario per il funzionamento,
      ma evita che il testo "tagli" bruscamente sul bordo.
    */
    .bottom-fade {
      position: absolute;
      z-index: 10;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 5vh;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(243,243,223,0),
        var(--paper)
      );
    }

    @media (max-width: 700px) {
      :root {
        --frame-width: 88vw;
        --frame-height: 82vh;
      }

      .instruction {
        top: 2.5vh;
        font-size: 14px;
      }

      .frame {
        padding: 17vh 9% 8vh;
      }

      .paragraph {
        font-size: clamp(20px, 5.5vw, 29px);
        line-height: .92;
        letter-spacing: -0.055em;
      }
    }
  </style>
</head>

<body>

  <!-- Questo testo può essere eliminato nella versione definitiva -->
  <div class="instruction">
    QUA IL TESTO SPARISCE E MAN MANO CHE SCORRI SI DISSOLVE
  </div>

  <main class="page">
    <section class="frame">

      <div class="story-window" id="storyWindow">
        <div class="story" id="story"></div>
      </div>

      <div class="top-fade"></div>
      <div class="bottom-fade"></div>

    </section>
  </main>

  <script>
    /*
      ============================================================
      RACCONTO
      ============================================================

      Per aggiungere il testo nei giorni successivi basta aggiungere
      un nuovo elemento tra le virgolette qui sotto.

      Esempio:
      "nuovo pensiero scritto domani..."
    */

    const thoughts = [
      "resto fino a quando torno",

      "sembri una prof di inglese",

      "quando sono a milano ma non devo lavorare mi sento un po’ in colpa, come quando da piccolo restavo a casa da scuola… hai presente?",

      "ho incontrato il mio match?",

      "noi sul balcone al freddo, io fumo, lui no. nella casa vicina, una tapparella si abbassa all’improvviso, una luce rossa dietro. “guarda!”, mi dice, prendendomi il braccio. “non vorrei sbagliarmi, ma secondo me è una prostituta.”. io mi giro, ma non c’è più nessuno dietro la finestra. due secondi dopo rientriamo e mi bacia.",

      "voi del nord avete la nebbia nel cervello"
    ];

    const story = document.getElementById("story");
    const windowEl = document.getElementById("storyWindow");

    thoughts.forEach((thought) => {
      const p = document.createElement("p");
      p.className = "paragraph";
      p.textContent = thought;
      story.appendChild(p);
    });

    /*
      Quando si apre la pagina, il racconto parte dall'inizio.
      L'utente può poi scorrere normalmente.
    */
    windowEl.scrollTop = 0;
  </script>

</body>
</html>
