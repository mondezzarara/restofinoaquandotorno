<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idee Valide — Racconto</title>

  <style>
    :root {
      --paper: #f5f2e6;
      --ink: #050505;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* LOGO INTRO */
    #intro-logo {
      position: fixed;
      inset: 0;
      background: var(--paper);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 1s ease;
      z-index: 2000;
    }

    #intro-logo img {
      width: 160px;
      opacity: 0;
      animation: fadeIn 1s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* TASTI A DESTRA */
    .nav-icons {
      position: fixed;
      right: 1%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0;
      z-index: 999;
    }

    .icon-square,
    .icon-circle,
    .icon-triangle {
      width: 22px;
      height: 22px;
      transition: opacity .25s ease;
    }

    .icon-square {
      background: rgba(80,120,255,0.30);
      border-radius: 3px;
    }

    .icon-circle {
      background: rgba(255,80,80,0.30);
      border-radius: 50%;
    }

    .icon-triangle {
      background: rgba(180,80,255,0.30);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .icon-square:active,
    .icon-circle:active,
    .icon-triangle:active {
      opacity: .55;
    }

    /* FRAME CENTRALE */
    .page {
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .frame {
      position: relative;
      width: min(64vw, 620px);
      height: 100%;
      padding: 3vh 10% 0;
      overflow: hidden;
    }

    /* TESTO RANDOMICO */
    .story-window {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .story-window::-webkit-scrollbar { display:none; }

    .story {
      padding-top: 2vh;
      opacity: 0;
      transition: opacity .8s ease;
    }

    .paragraph {
      margin: 0 0 1.2em;
      font-weight: 700;
      font-size: clamp(20px,5vw,32px);
      line-height: .95;
      letter-spacing: -0.045em;
    }

    /* QUADRATO BLU GRANDE PER REFRESH */
    .refresh-square {
      position: fixed;
      bottom: 3%;
      right: 3%;
      width: 42px;
      height: 42px;
      background: rgba(80,120,255,0.30);
      border-radius: 4px;
      cursor: pointer;
      transition: opacity .25s ease;
      z-index: 999;
    }

    .refresh-square:active {
      opacity: .55;
    }
  </style>
</head>

<body>

  <!-- LOGO INTRO -->
  <div id="intro-logo">
    <img src="logo-intro.png" alt="">
  </div>

  <!-- TASTI -->
  <div class="nav-icons">
    <a href="index.html" class="icon-square"></a>
    <a href="altro.html" class="icon-circle"></a>
    <a href="editoriali.html" class="icon-triangle"></a>
  </div>

  <!-- QUADRATO GRANDE PER REFRESH -->
  <div class="refresh-square" onclick="loadRandomModule()"></div>

  <main class="page">
    <section class="frame">
      <div class="story-window">
        <div class="story" id="story"></div>
      </div>
    </section>
  </main>

  <script>

    /* ⭐ ANIMAZIONE DELICATA DEI MODULI — DIRETTAMENTE ALL’INIZIO ⭐ */
    async function loadRandomModule() {
      const storyEl = document.getElementById("story");

      /* FADE OUT DELICATO */
      storyEl.style.opacity = 0;

      try {
        const response = await fetch("moduli.json");
        if (!response.ok) throw new Error("File non trovato");

        const modules = await response.json();
        const randomIndex = Math.floor(Math.random() * modules.length);
        const selected = modules[randomIndex];

        /* Aspetta che il fade-out finisca */
        setTimeout(() => {
          storyEl.innerHTML = "";

          selected.forEach(line => {
            const p = document.createElement("p");
            p.className = "paragraph";
            p.textContent = line;
            storyEl.appendChild(p);
          });

          /* FADE IN DELICATO */
          storyEl.style.opacity = 1;

        }, 300);

      } catch (e) {
        storyEl.innerHTML = `
          <p class="paragraph">Errore: impossibile caricare moduli.json</p>
        `;
        storyEl.style.opacity = 1;
      }
    }

    /* LOGO → SCOMPARE → CARICA MODULO */
   window.addEventListener("load", () => {

  // ⏳ Pausa più lunga prima del fade-out
  setTimeout(() => {
    document.getElementById("intro-logo").style.opacity = 0;

    // ⏳ Fade-out identico, poi carica il modulo
    setTimeout(() => {
      document.getElementById("intro-logo").style.display = "none";
      loadRandomModule();
    }, 1000);

  }, 1800); // ← durata aumentata (prima era 600)
});

  </script>

</body>
</html>
