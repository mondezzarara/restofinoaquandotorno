<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>restofinoaquandotorno</title>

  <style>
    :root {
      --paper: #f3f3df;
      --ink: #050505;
      --frame-width: min(64vw, 620px);
      --frame-height: 100svh;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      font-family: Helvetica, Arial, sans-serif;
    }

    .page {
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 0;
    }

    .frame {
      position: relative;
      width: var(--frame-width);
      height: 100%;
      overflow: hidden;
      padding: 3vh 10% 0;
      background: transparent;
    }

    /* Cornice aperta sotto */
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 7px solid var(--ink);
      border-bottom: none;
      clip-path: polygon(
        3% 1%, 98% 3%, 96% 38%,
        97% 90%, 50% 95%, 4% 90%,
        3% 68%, 5% 48%
      );
      filter: url("#rough");
      pointer-events: none;
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 4px -2px -2px 3px;
      border: 4px solid var(--ink);
      border-bottom: none;
      clip-path: polygon(
        4% 2%, 97% 4%, 94% 39%,
        96% 90%, 50% 95%, 6% 90%,
        4% 69%, 6% 48%
      );
      opacity: .8;
      pointer-events: none;
    }

    .story-window {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      overscroll-behavior: contain;
    }

    .story-window::-webkit-scrollbar { display: none; }

    .story {
      width: 100%;
      padding-top: 2.5vh;
      padding-bottom: 0;
    }

    .paragraph {
      margin: 0 0 1.2em;
      padding: 0;
      text-align: justify;
      text-align-last: left;
      font-weight: 700;
      font-size: clamp(20px, 5vw, 32px);
      line-height: .95;
      letter-spacing: -0.045em;
      word-spacing: -0.02em;
    }

    .top-fade {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 14vh;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        var(--paper) 0%,
        rgba(243,243,223,0.95) 10%,
        rgba(243,243,223,0.80) 30%,
        rgba(243,243,223,0.55) 55%,
        rgba(243,243,223,0.30) 75%,
        rgba(243,243,223,0.10) 90%,
        rgba(243,243,223,0) 100%
      );
    }

    @media (max-width: 700px) {
      :root { --frame-width: 90vw; }
      .frame { padding: 2.5vh 11% 0; }
      .paragraph { font-size: clamp(19px, 5.8vw, 28px); }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="frame">

      <div class="story-window" id="storyWindow">
        <div class="story" id="story"></div>
      </div>

      <div class="top-fade"></div>

    </section>
  </main>

  <script>
    async function loadStory() {
      const storyEl = document.getElementById("story");

      try {
        const response = await fetch("racconto.txt");
        const text = await response.text();

        const lines = text
          .split("\n")
          .map(line => line.trim())
          .filter(line => line.length > 0);

        lines.forEach(line => {
          const p = document.createElement("p");
          p.className = "paragraph";
          p.textContent = line;
          storyEl.appendChild(p);
        });

      } catch (e) {
        console.error("Impossibile caricare il racconto:", e);
      }
    }

    loadStory();
  </script>

</body>
</html>
